
services:
  postgres:
    image: postgres:17
    container_name: your-container
    restart: unless-stopped

    environment:
      POSTGRES_DB: your-database
      POSTGRES_USER: your-user
      POSTGRES_PASSWORD: your-passwaord

    ports:
      - "5432:5432"

    volumes:
      - pulso_postgres_data:/var/lib/postgresql/data

volumes:
  pulso_postgres_data:


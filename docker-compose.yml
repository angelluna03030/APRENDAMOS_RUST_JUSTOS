services:
  postgres:
    image: postgres:17
    container_name: postgresql
    restart: unless-stopped

    environment:
      POSTGRES_DB: tutorial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - pulso_postgres_data:/var/lib/postgresql/data

volumes:
  pulso_postgres_data:
[package]
name = "server_wed_test"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
dotenv = "0.15.0"
diesel = { version = "2.0.0", features = [
    "postgres",
    "uuid",
    "chrono",
    "numeric",
    "r2d2",
] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0"
actix-web-actors = "4.1"
actix = "0.13"
actix-cors = "0.7.2"
tera = "1.10.0"
[dependencies.uuid]
version = " 1.2.1"
features = ["v4", "fast-rng", "macro-diagnostics", "serde"]
